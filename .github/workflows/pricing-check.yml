name: Daily Pricing Check

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pricing-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/pricing-check.test.mjs
      - name: Check pricing drift
        id: check
        run: node scripts/pricing-check.mjs --report pricing-report.md
      - name: Open or update pricing drift issue
        if: steps.check.outputs.drift != '0' || steps.check.outputs.errors != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="定價檢查：偵測到與官方來源索引的差異"
          number=$(gh issue list --state open --label pricing-drift --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file pricing-report.md
          else
            gh label create pricing-drift --description "Automated pricing drift report" --color FBCA04 2>/dev/null || true
            gh issue create --title "$title" --label pricing-drift --body-file pricing-report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-report
          path: pricing-report.md
