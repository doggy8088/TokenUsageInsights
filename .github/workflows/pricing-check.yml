name: Daily Pricing Check

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pricing-check.yml'
      - 'scripts/pricing-*'
      - 'tests/pricing-check.test.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: pricing-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/pricing-check.test.mjs
      - name: Check pricing drift
        id: check
        run: node scripts/pricing-check.mjs --report pricing-report.md
      - name: Open or update pricing drift issue
        if: github.event_name != 'pull_request' && (steps.check.outputs.drift != '0' || steps.check.outputs.added != '0' || steps.check.outputs.errors != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="定價檢查：偵測到與官方定價文件的差異、新模型或解析錯誤"
          number=$(gh issue list --state open --label pricing-drift --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file pricing-report.md
          else
            gh label create pricing-drift --description "Automated pricing drift report" --color FBCA04 2>/dev/null || true
            gh issue create --title "$title" --label pricing-drift --body-file pricing-report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-report
          path: pricing-report.md
