name: Deploy landing page

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify required files and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          test -s public/assets/site.css
          test -s public/assets/site.js
          test -s public/assets/og-token-usage-insights.png
          test "$(tr -d '\r\n' < public/CNAME)" = "token.gh.miniasp.com"
          grep -Fq '<link rel="canonical" href="https://token.gh.miniasp.com/">' public/index.html
          grep -Fq 'application/ld+json' public/index.html
          grep -Fq 'property="og:image"' public/index.html
          grep -Fq 'npx --yes token-usage-insights' public/index.html
          grep -Fq 'User-agent: *' public/robots.txt
          if grep -RInE 'token-war-room|@token-war-room|Gemini CLI|Windsurf|Qwen Code' public; then
            echo "Found an unsupported or invented product reference." >&2
            exit 1
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
